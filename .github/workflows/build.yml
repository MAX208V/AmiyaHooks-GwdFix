name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Build release
        run: gradle :app:assembleRelease --stacktrace

      # 用 CI 里的 debug keystore 给 release 包签名，产出可直接安装的 APK
      - name: Sign APK
        id: sign
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "apk=$APK" >> $GITHUB_OUTPUT
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          $BT/apksigner sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --out AmiyaHooks-GwdFix-signed.apk "$APK"
          $BT/apksigner verify --print-certs AmiyaHooks-GwdFix-signed.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmiyaHooks-GwdFix
          path: AmiyaHooks-GwdFix-signed.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AmiyaHooks-GwdFix-signed.apk
