name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 自带 Android SDK（ANDROID_HOME 已设好），这里只补装 NDK/CMake
      - name: Install NDK and CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          ls "$ANDROID_HOME/ndk"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Sign APK
        run: |
          # runner 上没有 debug.keystore，先生成一个
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "built: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          $BT/apksigner sign --ks ~/.android/debug.keystore \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --out AmiyaHooks-GwdFix-signed.apk "$APK"
          $BT/apksigner verify --print-certs AmiyaHooks-GwdFix-signed.apk | head -5
          ls -la AmiyaHooks-GwdFix-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmiyaHooks-GwdFix
          path: AmiyaHooks-GwdFix-signed.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AmiyaHooks-GwdFix-signed.apk
